[package]
name = "hello-console"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# Not part of the Keel workspace: it is a Windows program, built only by
# build.ps1 / build.sh, and its output is a checked-in fixture.
[workspace]

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = false
strip = true
