# Release (spec section 7; P0-T8). Runs for version tags such as v0.1.0.
#
# Two jobs, so that the code being built never runs with a writable token:
#   build    read-only token: tests, `cargo xtask dist`, boots the image
#   publish  write token:     attests the artifacts and creates the release
#
# Output is always unsigned (SR-34). Secure Boot signing happens on the
# owner's machine with the owner's keys.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  build:
    name: Build and test release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends qemu-system-x86 ovmf
      - name: Allow this user to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Audit
        run: cargo xtask audit
      - name: Acceptance tests for every completed phase
        run: cargo xtask test --kvm
      - name: Build release artifacts
        run: cargo xtask dist --version "${GITHUB_REF_NAME#v}"
      - name: Boot the release disk image
        run: cargo xtask boot-check "target/dist/keel-${GITHUB_REF_NAME#v}.img" --kvm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: target/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Check the artifacts against their checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Keel $GITHUB_REF_NAME" \
            --notes "Unsigned development build. Verify before use: download the files into one folder and run \`cargo xtask verify <file>\` from a checkout of this repository. Keel is hardened by design but unaudited."
