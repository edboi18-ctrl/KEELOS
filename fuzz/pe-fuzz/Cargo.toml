[package]
name = "pe-fuzz"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

# Host-only mutation fuzzer for the PE parser (P2-S1), used by its own
# tests and by `cargo xtask fuzz-pe`. A separate crate so that `pe` itself
# never needs std (it is linked into the no_std peldr).
[dependencies]
pe = { path = "../../user/pe" }

[lints]
workspace = true
