[package]
name = "keel-linux-abi"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Debug tracing (`trace=` on the command line). Never in a release build
# (SR-21, ADR 0043).
debug-tracing = ["keel-hal/debug-tracing"]

[dependencies]
keel-core = { path = "../core" }

# The kernel half of keel-hal exists only on the kernel target.
[target.'cfg(target_os = "none")'.dependencies]
keel-hal = { path = "../hal" }

[lints]
workspace = true
