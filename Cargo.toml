[workspace]
resolver = "3"
members = ["xtask", "kernel/hal", "kernel/keel-kernel"]
# Plain `cargo build` / `cargo test` on the host only touch host-buildable
# crates. The kernel binary is built for x86_64-unknown-none by `cargo xtask`.
default-members = ["xtask", "kernel/hal"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

# SR-17: integer-overflow checks stay on in release, panics abort, and frame
# pointers are kept (see .cargo/config.toml) for backtraces.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
overflow-checks = true
debug = "line-tables-only"
codegen-units = 1
